plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lightstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lightstudio.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed key so each new build installs as an update over the previous one
    signingConfigs {
        lightstudio {
            storeFile file("lightstudio.keystore")
            storePassword "lightstudio"
            keyAlias "lightstudio"
            keyPassword "lightstudio"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lightstudio
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.lightstudio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.md', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}
